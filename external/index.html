<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="external.css" />
  <title>Resono Commendation</title>
  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="external.js" defer></script>
</head>

<body>

  <div class="page-background"></div>

  <!-- ===================================== -->
  <!-- PRE LOGIN -->
  <!-- ===================================== -->
  <div id="preLoginLayout" class="container-fluid p-0">

    <div class="row g-0 min-vh-100">

      <!-- HERO -->
      <div class="col-lg-7">

        <div class="hero-panel">

          <img src="../assets/RESONO_logo_edited.png" class="hero-logo">

          <span class="hero-badge">
            Employee Recognition Portal
          </span>

          <h1>
            Celebrate <br>Great Work.
          </h1>

        </div>

      </div>

      <!-- LOGIN -->
      <div class="col-lg-5">

        <div class="login-panel">

          <div id="loginCard" class="modern-card">

            <h4 class="mb-3">
              Sign in with Google
            </h4>

            <div id="g_id_onload"
              data-client_id="669577239986-n8s6hnr1pb881vhmtqvpioliuf9kuhre.apps.googleusercontent.com"
              data-callback="handleCredentialResponse" data-auto_select="false" data-prompt_parent_id="g_id_signin"
              data-itp_support="true">
            </div>

            <div class="g_id_signin"></div>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- ===================================== -->
  <!-- POST LOGIN -->
  <!-- ===================================== -->
  <div id="postLoginLayout" class="hidden">

    <!-- KEEP YOUR CURRENT BANNER -->

    <div class="container-fluid p-0">

      <div class="row g-0 recognition-wrapper">

        <!-- TOP BANNER -->
        <div class="col-12">

          <div class="top-brand-banner">

            <img src="../assets/RESONO_logo_edited.png" class="banner-logo" alt="Resono">

            <div>

              <div class="banner-badge">
                Employee Recognition Portal
              </div>

              <h5 class="banner-title">
                Celebrate Great Work.
              </h5>

            </div>

          </div>

        </div>

        <!-- FORM COLUMN -->
        <div id="formColumn" class="col-xl-5 col-lg-5 col-12">

          <div class="form-panel">

            <div class="form-header">

              <h2>Submit Recognition</h2>

              <p>
                Thank an employee for their contribution and impact.
              </p>

            </div>

            <!-- LOGIN -->
            <!---div class="modern-card">

                <h6 class="mb-3">
            Sign in with Google
          </h6--->

            <!---div id="g_id_onload" data-client_id="669577239986-n8s6hnr1pb881vhmtqvpioliuf9kuhre.apps.googleusercontent.com"
            data-callback="handleCredentialResponse" data-auto_select="false" data-prompt_parent_id="g_id_signin"
            data-itp_support="true">
          </div>

          <div class="g_id_signin"></div>

              </div--->

            <div id="externalUserInfo" class="user-card hidden mb-2">
            </div>

            <form id="externalCommendForm" class="hidden">

              <div class="row g-2">

                <!-- EMPLOYEE + POINTS -->
                <div class="col-12">

                  <div class="modern-card">

                    <label class="form-label modern-label">
                      Employee(s)
                    </label>

                    <div class="employee-search-wrapper mb-3">

                      <input type="text" id="employeeSearch" class="form-control modern-input"
                        placeholder="Search employee...">

                      <div id="employeeSuggestions" class="employee-suggestions">
                      </div>

                    </div>

                    <div id="externalSelectedUsers" class="selected-users mb-2">
                    </div>

                    <label class="form-label modern-label">
                      Recognition Points
                    </label>

                    <div class="points-grid">

                      <button type="button" class="point-card external-point-btn" data-point="1">1</button>
                      <button type="button" class="point-card external-point-btn" data-point="2">2</button>
                      <button type="button" class="point-card external-point-btn" data-point="3">3</button>
                      <button type="button" class="point-card external-point-btn" data-point="4">4</button>
                      <button type="button" class="point-card external-point-btn" data-point="5">5</button>

                    </div>

                    <input type="hidden" id="external_points">

                  </div>

                </div>

                <!-- VALUE -->
                <div class="col-12">

                  <div class="modern-card">

                    <label class="form-label modern-label">
                      Core Value
                    </label>

                    <select id="external_value" class="form-select modern-input">
                    </select>

                  </div>

                </div>

                <!-- MESSAGE -->
                <div class="col-12">

                  <div class="modern-card">

                    <label class="form-label modern-label">
                      Recognition Message
                    </label>

                    <textarea id="external_reason" class="form-control modern-input" rows="5"
                      placeholder="Describe why this employee deserves recognition..." required></textarea>

                  </div>

                </div>

                <!-- SUBMIT -->
                <div class="col-12">

                  <button type="submit" class="btn submit-btn w-100">

                    Submit Recognition

                  </button>

                </div>

              </div>

            </form>

          </div>

        </div>

        <!-- VALUES IMAGE COLUMN -->
        <div id="resonoValuesSection" class="col-xl-7 col-lg-7 hidden">

          <div class="values-side-panel">

            <div class="values-header">

              <h4>
                Resono Core Values
              </h4>

              <p>
                Use these values as your guide when recognizing employees.
              </p>

            </div>

            <div class="values-image-container">

              <img src="../assets/Resono-Values-resized.jpg" alt="Resono Values" class="values-side-image">

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</body>

</html>
